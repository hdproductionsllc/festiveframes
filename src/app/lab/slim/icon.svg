<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MySchoolFrame favicon, for /s/<school> and everything under it — the DARK treatment, the owner's pick: a school-navy
       tile carrying the plate-frame mark in paper with the brass chenille bar.
       Self-contained tile instead of a transparent glyph + media query, so the
       same dark look holds on light and dark tab strips alike.

       A COPY of src/app/school/icon.svg on purpose: Next resolves icons per
       route SEGMENT, and /s is a different segment from /school. Without this
       file the per-school builder — the page a parent lands on from a QR code in
       the bleachers — served the Festive Frames star from the app root. -->
  <rect width="64" height="64" rx="14" fill="#1b2a4a" />
  <path fill="#f6f3ec" fill-rule="evenodd"
    d="M12 15 h40 a6.5 6.5 0 0 1 6.5 6.5 v21 a6.5 6.5 0 0 1 -6.5 6.5 h-40 a6.5 6.5 0 0 1 -6.5 -6.5 v-21 a6.5 6.5 0 0 1 6.5 -6.5 Z
       M13 19.5 a3 3 0 0 0 -3 3 v12 a3 3 0 0 0 3 3 h38 a3 3 0 0 0 3 -3 v-12 a3 3 0 0 0 -3 -3 Z" />
  <rect x="23" y="41" width="18" height="4.6" rx="2.3" fill="#f8c53b" />
</svg>
