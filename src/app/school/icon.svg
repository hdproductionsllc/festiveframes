<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- MySchoolFrame mark: a license-plate frame in profile — thin rails, the
       school product's signature THICK bottom banner, and a brass chenille bar
       where the school name goes. Navy flips to a light body on dark tabs so
       the favicon doesn't sink into the tab strip. -->
  <style>
    .body { fill: #1b2a4a; }
    @media (prefers-color-scheme: dark) { .body { fill: #e8ecf5; } }
  </style>
  <path class="body" fill-rule="evenodd"
    d="M10 13 h44 a7 7 0 0 1 7 7 v24 a7 7 0 0 1 -7 7 h-44 a7 7 0 0 1 -7 -7 v-24 a7 7 0 0 1 7 -7 Z
       M11 18 a3 3 0 0 0 -3 3 v14 a3 3 0 0 0 3 3 h42 a3 3 0 0 0 3 -3 v-14 a3 3 0 0 0 -3 -3 Z" />
  <rect x="22" y="42" width="20" height="5" rx="2.5" fill="#f8c53b" />
</svg>
